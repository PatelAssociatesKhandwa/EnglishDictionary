<script
src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
></script>


<script>


/* =====================================================
   API URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbznhwqwtBWBqUbUA-FVfOYNYAJkFUaCEcfwwTagpWfW7yk0tsCWYJYfZB4gBErt7aQX/exec";


/* =====================================================
   GLOBALS
===================================================== */

let examRecords = [];

let examAnswers = {};

let examTimer = null;

let examTotalSeconds = 0;

let examRemainingSeconds = 0;

let examSubmitted = false;


/* =====================================================
   API
===================================================== */

async function apiGet(params){

  const url =
    API_URL +
    "?" +
    new URLSearchParams(params).toString() +
    "&_=" +
    Date.now();


  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function(){
        controller.abort();
      },
      30000
    );


  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          redirect:"follow",
          signal:
            controller.signal
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      throw new Error(
        "Server returned invalid response."
      );

    }


    return data;


  }finally{

    clearTimeout(
      timeout
    );

  }

}


/* =====================================================
   SERVER CHECK
===================================================== */

async function checkServer(){

  const status =
    document.getElementById(
      "serverStatus"
    );


  try{

    const data =
      await apiGet({
        action:"health"
      });


    if(data.success){

      status.textContent =
        "● Server Connected";

      status.style.background =
        "#d1e7dd";

      status.style.color =
        "#0f5132";

    }else{

      throw new Error(
        data.message
      );

    }


  }catch(error){

    status.textContent =
      "● Server Connection Error: " +
      error.message;

    status.style.background =
      "#f8d7da";

    status.style.color =
      "#842029";

  }

}


/* =====================================================
   TAB
===================================================== */

function openTab(
  tabId,
  button
){

  document
    .querySelectorAll(
      ".tab-content"
    )
    .forEach(
      function(el){

        el.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(
      ".tab-btn"
    )
    .forEach(
      function(el){

        el.classList.remove(
          "active"
        );

      }
    );


  document
    .getElementById(
      tabId
    )
    .classList.add(
      "active"
    );


  button.classList.add(
    "active"
  );


  if(
    tabId ===
    "dictionaryTab"
  ){

    loadDictionary();

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  id,
  message,
  type
){

  const el =
    document.getElementById(
      id
    );


  el.textContent =
    message;


  el.className =
    "message " +
    type;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value){

  return String(
    value || ""
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}


/* =====================================================
   SEARCH
===================================================== */

async function searchWord(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const btn =
    document.getElementById(
      "searchBtn"
    );


  const result =
    document.getElementById(
      "searchResult"
    );


  const word =
    input.value.trim();


  if(!word){

    showMessage(
      "searchMessage",
      "Please enter an English word.",
      "error"
    );

    return;

  }


  btn.disabled =
    true;


  result.innerHTML =
    `
      <div class="card loading">
        Generating meaning and examples...
      </div>
    `;


  try{

    const data =
      await apiGet({

        action:"search",

        word:word

      });


    if(!data.success){

      throw new Error(
        data.message ||
        "Search failed."
      );

    }


    renderSearchResult(
      data.record
    );


    showMessage(
      "searchMessage",
      "Word loaded successfully.",
      "success"
    );


  }catch(error){

    result.innerHTML =
      "";


    showMessage(
      "searchMessage",
      error.message,
      "error"
    );


  }finally{

    btn.disabled =
      false;

  }

}


/* =====================================================
   SENTENCES
===================================================== */

function getSentences(record){

  if(
    Array.isArray(
      record.sentences
    )
  ){

    return record.sentences
      .map(
        function(s){

          return {

            english:
              s.english ||
              "",

            hindi:
              s.hindi ||
              ""

          };

        }
      )
      .filter(
        function(s){

          return (
            s.english ||
            s.hindi
          );

        }
      );

  }


  const result =
    [];


  for(
    let i=1;
    i<=5;
    i++
  ){

    const en =
      record[
        "sentence" +
        i
      ];


    const hi =
      record[
        "sentence" +
        i +
        "Hindi"
      ];


    if(
      en ||
      hi
    ){

      result.push({

        english:
          en || "",

        hindi:
          hi || ""

      });

    }

  }


  return result;

}


/* =====================================================
   SEARCH RESULT
===================================================== */

function renderSearchResult(
  record
){

  const result =
    document.getElementById(
      "searchResult"
    );


  let html = `

    <div class="card">

      <div class="word-title">
        ${escapeHtml(
          record.word
        )}
      </div>

      <div class="meaning">
        ${escapeHtml(
          record.meaning
        )}
      </div>

      <div class="pronunciation">
        ${escapeHtml(
          record.pronunciation
        )}
      </div>

  `;


  getSentences(record)
    .slice(0,2)
    .forEach(
      function(sentence,index){

        html += `

          <div class="example">

            <div class="english">
              ${index+1}.
              ${escapeHtml(
                sentence.english
              )}
            </div>

            <div class="hindi">
              ${escapeHtml(
                sentence.hindi
              )}
            </div>

          </div>

        `;

      }
    );


  html += `
    </div>
  `;


  result.innerHTML =
    html;

}


/* =====================================================
   DICTIONARY
===================================================== */

async function loadDictionary(){

  const list =
    document.getElementById(
      "dictionaryList"
    );


  list.innerHTML =
    `
      <div class="loading">
        Loading dictionary...
      </div>
    `;


  try{

    const data =
      await apiGet({

        action:
          "allWords"

      });


    if(!data.success){

      throw new Error(
        data.message
      );

    }


    const words =
      Array.isArray(
        data.words
      )
      ? data.words
      : [];


    if(
      words.length === 0
    ){

      list.innerHTML =
        `
          <div class="loading">
            No words found.
          </div>
        `;

      return;

    }


    const unique =
      [];

    const seen =
      new Set();


    words.forEach(
      function(item){

        const word =
          String(
            item.word || ""
          )
          .trim();


        const key =
          word
            .toLowerCase()
            .replace(
              /\s+/g,
              " "
            );


        if(
          word &&
          !seen.has(key)
        ){

          seen.add(key);


          unique.push({

            id:
              item.id,

            word:
              word

          });

        }

      }
    );


    list.innerHTML =
      "";


    unique.forEach(
      function(item){

        const wrapper =
          document.createElement(
            "div"
          );


        wrapper.className =
          "word-item";


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "word-button";


        button.textContent =
          item.word;


        const details =
          document.createElement(
            "div"
          );


        details.className =
          "word-details";


        button.onclick =
          function(){

            toggleWordDetails(
              item.word,
              details
            );

          };


        wrapper.appendChild(
          button
        );


        wrapper.appendChild(
          details
        );


        list.appendChild(
          wrapper
        );

      }
    );


  }catch(error){

    list.innerHTML =
      "";


    showMessage(
      "dictionaryMessage",
      error.message,
      "error"
    );

  }

}


/* =====================================================
   DICTIONARY DETAILS
===================================================== */

async function toggleWordDetails(
  word,
  details
){

  if(
    details.classList.contains(
      "show"
    )
  ){

    details.classList.remove(
      "show"
    );

    return;

  }


  details.classList.add(
    "show"
  );


  details.innerHTML =
    `
      <div class="loading">
        Generating details...
      </div>
    `;


  try{

    const data =
      await apiGet({

        action:
          "search",

        word:
          word

      });


    if(!data.success){

      throw new Error(
        data.message
      );

    }


    const record =
      data.record;


    let html = `

      <div class="details-meaning">
        ${escapeHtml(
          record.meaning
        )}
      </div>

      <div class="details-pronunciation">
        ${escapeHtml(
          record.pronunciation
        )}
      </div>

    `;


    getSentences(record)
      .slice(0,2)
      .forEach(
        function(sentence,index){

          html += `

            <div class="detail-example">

              <div class="en">
                ${index+1}.
                ${escapeHtml(
                  sentence.english
                )}
              </div>

              <div class="hi">
                ${escapeHtml(
                  sentence.hindi
                )}
              </div>

            </div>

          `;

        }
      );


    html += `

      <button
        class="delete-btn"
        onclick="deleteDictionaryWord(
          '${escapeJs(word)}',
          this
        )"
      >
        Delete Word
      </button>

    `;


    details.innerHTML =
      html;


  }catch(error){

    details.innerHTML =
      `
        <div
          class="message error"
          style="display:block"
        >
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

  }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteDictionaryWord(
  word,
  button
){

  if(
    !confirm(
      'Delete "' +
      word +
      '"?'
    )
  ){

    return;

  }


  button.disabled =
    true;


  try{

    const data =
      await apiGet({

        action:
          "deleteWord",

        word:
          word

      });


    if(!data.success){

      throw new Error(
        data.message
      );

    }


    loadDictionary();


  }catch(error){

    button.disabled =
      false;


    showMessage(
      "dictionaryMessage",
      error.message,
      "error"
    );

  }

}


/* =====================================================
   EXCEL IMPORT
===================================================== */

async function importExcel(){

  const fileInput =
    document.getElementById(
      "excelFile"
    );


  const file =
    fileInput.files[0];


  if(!file){

    showMessage(
      "importMessage",
      "Please select Excel/CSV file.",
      "error"
    );

    return;

  }


  try{

    const buffer =
      await file.arrayBuffer();


    const workbook =
      XLSX.read(
        buffer,
        {
          type:"array"
        }
      );


    const sheet =
      workbook.Sheets[
        workbook.SheetNames[0]
      ];


    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header:1,
          defval:""
        }
      );


    const words =
      [];


    rows.forEach(
      function(row){

        if(
          row &&
          row.length
        ){

          const word =
            String(
              row[0] || ""
            ).trim();


          if(word){

            words.push(
              word
            );

          }

        }

      }
    );


    if(
      words.length === 0
    ){

      throw new Error(
        "No words found in first column."
      );

    }


    const unique =
      [];

    const seen =
      new Set();


    words.forEach(
      function(word){

        const key =
          word
            .toLowerCase()
            .replace(
              /\s+/g,
              " "
            );


        if(
          !seen.has(key)
        ){

          seen.add(key);

          unique.push(
            word
          );

        }

      }
    );


    let added =
      0;

    let updated =
      0;

    let alreadyAvailable =
      0;

    let failed =
      0;


    const chunkSize =
      40;


    for(
      let i=0;
      i<unique.length;
      i+=chunkSize
    ){

      const chunk =
        unique.slice(
          i,
          i+chunkSize
        );


      showMessage(
        "importMessage",
        "Importing " +
        Math.min(
          i+chunk.length,
          unique.length
        ) +
        " / " +
        unique.length,
        "success"
      );


      const data =
        await apiGet({

          action:
            "importWords",

          words:
            JSON.stringify(
              chunk
            )

        });


      if(data.success){

        added +=
          Number(
            data.added || 0
          );

        updated +=
          Number(
            data.updated || 0
          );

        alreadyAvailable +=
          Number(
            data.alreadyAvailable || 0
          );

        failed +=
          Number(
            data.failed || 0
          );

      }else{

        failed +=
          chunk.length;

      }

    }


    document.getElementById(
      "importResult"
    ).innerHTML = `

      <div class="card">

        <b>
          Import Complete
        </b>

        <p>
          Added:
          <b>${added}</b>
        </p>

        <p>
          Updated:
          <b>${updated}</b>
        </p>

        <p>
          Already Available:
          <b>${alreadyAvailable}</b>
        </p>

        <p>
          Failed:
          <b>${failed}</b>
        </p>

      </div>

    `;


    showMessage(
      "importMessage",
      "Excel import completed.",
      "success"
    );


  }catch(error){

    showMessage(
      "importMessage",
      error.message,
      "error"
    );

  }

}


/* =====================================================
   START EXAM
===================================================== */

async function startExam(){

  const count =
    Number(
      document.getElementById(
        "questionCount"
      ).value
    );


  const minutes =
    Number(
      document.getElementById(
        "examMinutes"
      ).value
    );


  if(
    count < 1
  ){

    showMessage(
      "examSetupMessage",
      "Enter valid question count.",
      "error"
    );

    return;

  }


  if(
    minutes < 1
  ){

    showMessage(
      "examSetupMessage",
      "Enter valid exam time.",
      "error"
    );

    return;

  }


  showMessage(
    "examSetupMessage",
    "Preparing Exam...",
    "success"
  );


  try{

    const data =
      await apiGet({

        action:
          "examData",

        count:
          count

      });


    if(!data.success){

      throw new Error(
        data.message
      );

    }


    examRecords =
      data.records || [];


    if(
      examRecords.length === 0
    ){

      throw new Error(
        "No dictionary words available."
      );

    }


    examAnswers =
      {};


    examSubmitted =
      false;


    examTotalSeconds =
      minutes * 60;


    examRemainingSeconds =
      examTotalSeconds;


    document.getElementById(
      "examSetup"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "examResult"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "examArea"
    ).classList.remove(
      "hidden"
    );


    renderExam();

    startExamTimer();


  }catch(error){

    showMessage(
      "examSetupMessage",
      error.message,
      "error"
    );

  }

}


/* =====================================================
   RENDER EXAM
===================================================== */

function renderExam(){

  const container =
    document.getElementById(
      "examQuestions"
    );


  container.innerHTML =
    "";


  examRecords.forEach(
    function(record,index){

      const question =
        document.createElement(
          "div"
        );


      question.className =
        "exam-question";


      const correct =
        String(
          record.meaning || ""
        ).trim();


      const distractors =
        examRecords

          .filter(
            function(_,i){
              return i !== index;
            }
          )

          .map(
            function(r){

              return String(
                r.meaning || ""
              ).trim();

            }
          )

          .filter(
            function(value){

              return (
                value &&
                value.toLowerCase()
                !==
                correct.toLowerCase()
              );

            }
          );


      const options =
        shuffleArray([

          correct,

          ...distractors.slice(
            0,
            3
          )

        ]);


      question.innerHTML = `

        <div class="question-number">
          Question ${index+1}
          of ${examRecords.length}
        </div>

        <div class="question-word">
          ${escapeHtml(
            record.word
          )}
        </div>

        <div class="options"></div>

      `;


      const optionsContainer =
        question.querySelector(
          ".options"
        );


      options.forEach(
        function(option){

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "answer-option";


          button.textContent =
            option;


          button.onclick =
            function(){

              selectExamAnswer(

                index,

                option,

                correct,

                optionsContainer,

                button

              );

            };


          optionsContainer.appendChild(
            button
          );

        }
      );


      container.appendChild(
        question
      );

    }
  );

}


/* =====================================================
   ANSWER CLICK
===================================================== */

function selectExamAnswer(

  questionIndex,

  selectedAnswer,

  correctAnswer,

  optionsContainer,

  clickedButton

){

  if(
    examAnswers[
      questionIndex
    ] !== undefined
  ){

    return;

  }


  examAnswers[
    questionIndex
  ] =
    selectedAnswer;


  const buttons =
    optionsContainer
      .querySelectorAll(
        ".answer-option"
      );


  buttons.forEach(
    function(button){

      button.disabled =
        true;

      button.classList.add(
        "disabled"
      );

    }
  );


  /*
   * Correct = GREEN
   */

  if(
    selectedAnswer
      .toLowerCase() ===
    correctAnswer
      .toLowerCase()
  ){

    clickedButton.classList.add(
      "correct"
    );

  }


  /*
   * Wrong = RED
   * Correct option = GREEN
   */

  else{

    clickedButton.classList.add(
      "wrong"
    );


    buttons.forEach(
      function(button){

        if(
          button.textContent
            .trim()
            .toLowerCase() ===
          correctAnswer
            .toLowerCase()
        ){

          button.classList.add(
            "correct"
          );

        }

      }
    );

  }

}


/* =====================================================
   TIMER
===================================================== */

function startExamTimer(){

  clearInterval(
    examTimer
  );


  updateExamTimer();


  examTimer =
    setInterval(
      function(){

        if(
          examRemainingSeconds <= 0
        ){

          clearInterval(
            examTimer
          );


          autoSubmitExam();

          return;

        }


        examRemainingSeconds--;

        updateExamTimer();

      },
      1000
    );

}


/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateExamTimer(){

  document.getElementById(
    "totalTimeDisplay"
  ).textContent =
    formatTime(
      examTotalSeconds
    );


  const remaining =
    document.getElementById(
      "remainingTimeDisplay"
    );


  remaining.textContent =
    formatTime(
      examRemainingSeconds
    );


  if(
    examRemainingSeconds <= 60
  ){

    remaining.classList.add(
      "timer-danger"
    );

  }else{

    remaining.classList.remove(
      "timer-danger"
    );

  }

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
  seconds
){

  const min =
    Math.floor(
      seconds / 60
    );


  const sec =
    seconds % 60;


  return String(min)
    .padStart(2,"0") +
    ":" +
    String(sec)
      .padStart(2,"0");

}


/* =====================================================
   SUBMIT EXAM
===================================================== */

async function submitExam(){

  if(
    examSubmitted
  ){

    return;

  }


  examSubmitted =
    true;


  clearInterval(
    examTimer
  );


  const answers =
    examRecords.map(
      function(record,index){

        return {

          word:
            record.word,

          answer:
            examAnswers[index] ||
            "",

          correctAnswer:
            record.meaning ||
            ""

        };

      }
    );


  let correctCount =
    0;


  answers.forEach(
    function(item){

      if(

        item.answer &&

        item.answer
          .toLowerCase() ===

        item.correctAnswer
          .toLowerCase()

      ){

        correctCount++;

      }

    }
  );


  try{

    await apiGet({

      action:
        "saveExam",

      answers:
        JSON.stringify(
          answers
        )

    });

  }catch(error){

    console.error(
      error
    );

  }


  const total =
    examRecords.length;


  const percentage =
    total
      ? Math.round(
          (
            correctCount /
            total
          ) * 100
        )
      : 0;


  showExamResult(
    correctCount,
    total,
    percentage
  );

}


/* =====================================================
   AUTO SUBMIT
===================================================== */

function autoSubmitExam(){

  if(
    examSubmitted
  ){

    return;

  }


  submitExam();

}


/* =====================================================
   RESULT
===================================================== */

function showExamResult(
  score,
  total,
  percentage
){

  document.getElementById(
    "examArea"
  ).classList.add(
    "hidden"
  );


  const result =
    document.getElementById(
      "examResult"
    );


  result.classList.remove(
    "hidden"
  );


  result.innerHTML = `

    <div class="exam-result">

      <h2>
        Exam Completed
      </h2>

      <div class="score">
        ${score} / ${total}
      </div>

      <p>
        Percentage:
        <b>${percentage}%</b>
      </p>

      <button
        class="primary"
        onclick="resetExam()"
      >
        Start New Exam
      </button>

    </div>

  `;

}


/* =====================================================
   RESET
===================================================== */

function resetExam(){

  clearInterval(
    examTimer
  );


  examRecords =
    [];


  examAnswers =
    {};


  examSubmitted =
    false;


  document.getElementById(
    "examArea"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "examResult"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "examSetup"
  ).classList.remove(
    "hidden"
  );

}

   ENTER KEY
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        searchWord();

      }

    }
  );

checkServer();
