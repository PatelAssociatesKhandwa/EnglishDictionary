<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - English Hindi Dictionary</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{

}

header h1{
  margin:0;
  font-size:25px;

}

header p{
  margin:5px 0 0;

}

.container{

}

.server-status{
  text-align:center;
  padding:9px;

  border-radius:8px;

  background:#fff3cd;

}

.tabs{

}

.tab-btn{
  flex:1;

  border:none;

}

.tab-btn.active{
  background:#0b5ed7;

}

.tab-content{

}

.tab-content.active{
  display:block;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#0b5ed7;
  font-size:21px;
}

label{
  display:block;
  margin:10px 0 5px;
  font-weight:bold;
}

input,
select,
button{
  font-family:inherit;
}

input[type="text"],
input[type="number"],
input[type="file"],
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button.primary{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#0b5ed7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.primary:disabled{

  cursor:not-allowed;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  display:none;
}

.message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

/* SEARCH RESULT */

.word-title{
  font-size:27px;
  font-weight:bold;
  color:#0b5ed7;
  margin-bottom:5px;
}

.meaning{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.pronunciation{
  color:#666;
  margin-bottom:15px;
}

.example{
  border-left:4px solid #0b5ed7;
  background:#f5f8fc;
  padding:10px 12px;
  margin:10px 0;
  border-radius:5px;
}

.example .english{
  font-weight:bold;
}

.example .hindi{
  margin-top:5px;
  color:#555;
}

/* DICTIONARY */

.dictionary-list{
  margin-top:10px;
}

.word-item{
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:8px;
  overflow:hidden;
}

.word-button{
  width:100%;
  border:none;
  background:white;
  padding:13px;
  text-align:left;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  color:#222;
}

.word-button:hover{
  background:#f1f6ff;
}

.word-details{
  display:none;
  padding:14px;
  border-top:1px solid #ddd;
  background:#fafcff;
}

.word-details.show{
  display:block;
}

.details-meaning{
  font-size:19px;
  font-weight:bold;
  color:#0b5ed7;
  margin-bottom:5px;
}

.details-pronunciation{
  color:#666;
  margin-bottom:12px;
}

.detail-example{
  margin:9px 0;
  padding:10px;
  background:white;
  border-left:3px solid #0b5ed7;
  border-radius:5px;
}

.detail-example .en{
  font-weight:bold;
}

.detail-example .hi{
  margin-top:4px;
  color:#555;
}

.delete-btn{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#dc3545;
  color:white;
  cursor:pointer;
}

/* EXAM */

.exam-question{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.question-number{
  font-size:14px;
  color:#666;
  margin-bottom:5px;
}

.question-word{
  font-size:23px;
  font-weight:bold;
  color:#0b5ed7;
  margin-bottom:15px;
}

.answer-option{
  width:100%;
  text-align:left;
  padding:12px;
  margin:7px 0;

  cursor:pointer;

}

.answer-option:hover{

}

.answer-option.correct{

  color:#0f5132;
  font-weight:bold;
}

.answer-option.wrong{

  color:#842029;
  font-weight:bold;
}

.answer-option.disabled{
  cursor:not-allowed;
}

.correct-answer{
  margin-top:10px;
  padding:10px;
  background:#e8f5e9;
  border-radius:7px;
  color:#146c43;
  font-weight:bold;
}

.exam-timer{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  padding:12px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:bold;
}

.timer-danger{
  color:#dc3545;
}

.exam-result{
  background:white;
  border-radius:12px;
  padding:20px;
  text-align:center;
}

.score{
  font-size:32px;
  font-weight:bold;
  color:#0b5ed7;
}

.hidden{
  display:none !important;
}

.import-result{
  margin-top:15px;
}

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:14px;
  }

  .tab-btn{
    min-width:110px;
    font-size:13px;
  }

  .question-word{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <h1>PATEL ASSOCIATES</h1>
  <p>English → Hindi Personal Dictionary</p>
</header>

<div class="container">

  <div id="serverStatus" class="server-status">
    Connecting to server...
  </div>

  <div class="tabs">

    <button class="tab-btn active"
            onclick="openTab('searchTab',this)">
      Search English Word
    </button>

    <button class="tab-btn"
            onclick="openTab('dictionaryTab',this)">
      Dictionary List
    </button>

    <button class="tab-btn"
            onclick="openTab('importTab',this)">
      Excel Import
    </button>

    <button class="tab-btn"
            onclick="openTab('examTab',this)">
      Exam
    </button>

  </div>


  <!-- SEARCH TAB -->

  <section id="searchTab" class="tab-content active">

    <div class="card">

      <h2>Search English Word</h2>

      <input
        type="text"
        id="searchInput"
        placeholder="Enter English word..."
        autocomplete="off"
      >

      <button
        class="primary"
        id="searchBtn"
        onclick="searchWord()">
        Search
      </button>

      <div id="searchMessage" class="message"></div>

    </div>

    <div id="searchResult"></div>

  </section>


  <!-- DICTIONARY TAB -->

  <section id="dictionaryTab" class="tab-content">

    <div class="card">

      <h2>Dictionary List</h2>

      <button
        class="primary"
        onclick="loadDictionary()">
        Refresh Dictionary
      </button>

      <div id="dictionaryMessage" class="message"></div>

      <div id="dictionaryList"
           class="dictionary-list">
      </div>

    </div>

  </section>


  <!-- IMPORT TAB -->

  <section id="importTab" class="tab-content">

    <div class="card">

      <h2>Excel Import</h2>

      <p>
        Excel/CSV की पहली column में English words रखें।
      </p>

      <label>Select Excel / CSV File</label>

      <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls,.csv"
      >

      <button
        class="primary"
        onclick="importExcel()">
        Import Words
      </button>

      <div id="importMessage" class="message"></div>

      <div id="importResult"
           class="import-result">
      </div>

    </div>

  </section>


  <!-- EXAM TAB -->

  <section id="examTab" class="tab-content">

    <div id="examSetup" class="card">

      <h2>Exam Setup</h2>

      <label>Number of Questions</label>

      <input
        type="number"
        id="questionCount"
        min="1"
        value="10"
      >

      <label>Total Time (Minutes)</label>

      <input
        type="number"
        id="examMinutes"
        min="1"
        value="10"
      >

      <button
        class="primary"
        onclick="startExam()">
        Start Exam
      </button>

      <div id="examSetupMessage"
           class="message">
      </div>

    </div>

    <div id="examArea"
         class="hidden">

      <div class="exam-timer">

        <span>
          Total Time:
          <span id="totalTimeDisplay">--:--</span>
        </span>

        <span>
          Remaining:
          <span id="remainingTimeDisplay">--:--</span>
        </span>

      </div>

      <div id="examQuestions"></div>

      <button
        id="submitExamBtn"
        class="primary"
        onclick="submitExam()">
        Submit Exam
      </button>

    </div>

    <div id="examResult"
         class="hidden">
    </div>

  </section>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

/* =========================================================
   API URL
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbznhwqwtBWBqUbUA-FVfOYNYAJkFUaCEcfwwTagpWfW7yk0tsCWYJYfZB4gBErt7aQX/exec";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let dictionaryLoaded = false;

let examRecords = [];

let examAnswers = {};

let examTimer = null;

let examTotalSeconds = 0;

let examRemainingSeconds = 0;

let examSubmitted = false;


/* =========================================================
   API GET
========================================================= */

async function apiGet(params){

  const url =
    API_URL +
    "?" +
    new URLSearchParams(params).toString() +
    "&_=" +
    Date.now();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      30000
    );

  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          redirect:"follow",
          signal:controller.signal
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP Error " +
        response.status
      );
    }

    const text =
      await response.text();

    let data;

    try{

      data =
        JSON.parse(text);

    }catch(e){

      console.error(
        "Server response:",
        text
      );

      throw new Error(
        "Server returned invalid response."
      );
    }

    return data;

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   SERVER CHECK
========================================================= */

async function checkServer(){

  const status =
    document.getElementById(
      "serverStatus"
    );

  try{

    const data =
      await apiGet({
        action:"health"
      });

    if(data.success){

      status.textContent =
        "● Server Connected";

      status.style.background =
        "#d1e7dd";

      status.style.color =
        "#0f5132";

    }else{

      throw new Error(
        data.message ||
        "Server error"
      );

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "● Server Connection Error: " +
      error.message;

    status.style.background =
      "#f8d7da";

    status.style.color =
      "#842029";

  }

}


/* =========================================================
   TAB SYSTEM
========================================================= */

function openTab(tabId,button){

  document
    .querySelectorAll(".tab-content")
    .forEach(
      el => el.classList.remove("active")
    );

  document
    .querySelectorAll(".tab-btn")
    .forEach(
      el => el.classList.remove("active")
    );

  document
    .getElementById(tabId)
    .classList.add("active");

  button.classList.add("active");

  if(tabId === "dictionaryTab"){

    loadDictionary();

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  id,
  message,
  type
){

  const el =
    document.getElementById(id);

  el.textContent =
    message;

  el.className =
    "message " +
    type;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SEARCH WORD
========================================================= */

async function searchWord(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const btn =
    document.getElementById(
      "searchBtn"
    );

  const result =
    document.getElementById(
      "searchResult"
    );

  const word =
    input.value.trim();

  if(!word){

    showMessage(
      "searchMessage",
      "Please enter an English word.",
      "error"
    );

    return;

  }

  btn.disabled = true;

  result.innerHTML =
    '<div class="card loading">Searching...</div>';

  try{

    const data =
      await apiGet({
        action:"search",
        word:word
      });

    if(!data.success){

      throw new Error(
        data.message ||
        "Word search failed."
      );

    }

    showMessage(
      "searchMessage",
      "Word saved / loaded successfully.",
      "success"
    );

    renderSearchResult(
      data.record
    );

  }catch(error){

    console.error(error);

    result.innerHTML = "";

    showMessage(
      "searchMessage",
      error.message,
      "error"
    );

  }finally{

    btn.disabled = false;

  }

}


/* =========================================================
   RENDER SEARCH RESULT
========================================================= */

function renderSearchResult(record){

  if(!record){

    return;

  }

  const result =
    document.getElementById(
      "searchResult"
    );

  let html = `
    <div class="card">

      <div class="word-title">
        ${escapeHtml(record.word || "")}
      </div>

      <div class="meaning">
        ${escapeHtml(record.meaning || "")}
      </div>

      <div class="pronunciation">
        ${escapeHtml(record.pronunciation || "")}
      </div>
  `;

  const sentences =
    getSentences(record);

  sentences
    .slice(0,2)
    .forEach((s,index)=>{

      html += `
        <div class="example">

          <div class="english">
            ${index+1}. ${escapeHtml(s.english)}
          </div>

          <div class="hindi">
            ${escapeHtml(s.hindi)}
          </div>

        </div>
      `;

    });

  html += `
    </div>
  `;

  result.innerHTML =
    html;

}


/* =========================================================
   GET SENTENCES
   Supports multiple possible server formats
========================================================= */

function getSentences(record){

  if(
    Array.isArray(record.sentences)
  ){

    return record.sentences
      .filter(s => s)
      .map(s => ({
        english:
          s.english ||
          s.en ||
          "",
        hindi:
          s.hindi ||
          s.hi ||
          ""
      }));

  }

  const arr = [];

  for(let i=1;i<=5;i++){

    const english =
      record["sentence"+i];

    const hindi =
      record["sentence"+i+"Hindi"];

    if(
      english ||
      hindi
    ){

      arr.push({
        english:english || "",
        hindi:hindi || ""
      });

    }

  }

  return arr;

}


/* =========================================================
   DICTIONARY LIST
========================================================= */

async function loadDictionary(){

  const list =
    document.getElementById(
      "dictionaryList"
    );

  list.innerHTML =
    '<div class="loading">Loading dictionary...</div>';

  try{

    const data =
      await apiGet({
        action:"allWords"
      });

    if(!data.success){

      throw new Error(
        data.message ||
        "Unable to load dictionary."
      );

    }

    const words =
      Array.isArray(data.words)
      ? data.words
      : [];

    dictionaryLoaded = true;

    if(words.length === 0){

      list.innerHTML =
        '<div class="loading">No words found.</div>';

      return;

    }

    /* Remove duplicate words */
    const unique = [];

    const seen =
      new Set();

    words.forEach(item=>{

      const word =
        String(
          item.word || ""
        ).trim();

      const key =
        word.toLowerCase()
          .replace(/\s+/g," ");

      if(
        word &&
        !seen.has(key)
      ){

        seen.add(key);

        unique.push({
          id:item.id,
          word:word
        });

      }

    });

    list.innerHTML =
      "";

    unique.forEach(
      (item,index)=>{

        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "word-item";

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "word-button";

        button.textContent =
          item.word;

        const details =
          document.createElement(
            "div"
          );

        details.className =
          "word-details";

        details.innerHTML =
          '<div class="loading">Loading details...</div>';

        button.onclick =
          function(){

            toggleWordDetails(
              item.word,
              details
            );

          };

        wrapper.appendChild(
          button
        );

        wrapper.appendChild(
          details
        );

        list.appendChild(
          wrapper
        );

      }
    );

  }catch(error){

    console.error(error);

    list.innerHTML =
      "";

    showMessage(
      "dictionaryMessage",
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DICTIONARY WORD CLICK
========================================================= */

async function toggleWordDetails(
  word,
  details
){

  if(
    details.classList.contains("show")
  ){

    details.classList.remove(
      "show"
    );

    return;

  }

  details.classList.add(
    "show"
  );

  details.innerHTML =
    '<div class="loading">Loading meaning and examples...</div>';

  try{

    /*
      IMPORTANT:
      We use the search API here.
      This guarantees that incomplete
      dictionary records are repaired
      by the server.
    */

    const data =
      await apiGet({
        action:"search",
        word:word
      });

    if(!data.success){

      throw new Error(
        data.message ||
        "Unable to load word details."
      );

    }

    const record =
      data.record;

    let html = "";

    html += `
      <div class="details-meaning">
        ${escapeHtml(record.meaning || "")}
      </div>
    `;

    if(record.pronunciation){

      html += `
        <div class="details-pronunciation">
          Pronunciation:
          ${escapeHtml(record.pronunciation)}
        </div>
      `;

    }

    const sentences =
      getSentences(record);

    const firstTwo =
      sentences.slice(0,2);

    if(firstTwo.length === 0){

      html += `
        <div class="detail-example">
          No examples available.
        </div>
      `;

    }

    firstTwo.forEach(
      (s,index)=>{

        html += `
          <div class="detail-example">

            <div class="en">
              ${index+1}.
              ${escapeHtml(s.english)}
            </div>

            <div class="hi">
              ${escapeHtml(s.hindi)}
            </div>

          </div>
        `;

      }
    );

    html += `
      <button
        class="delete-btn"
        onclick="deleteDictionaryWord(
          '${escapeJs(word)}',
          this
        )">
        Delete Word
      </button>
    `;

    details.innerHTML =
      html;

  }catch(error){

    console.error(error);

    details.innerHTML =
      `
        <div class="message error"
             style="display:block">
          ${escapeHtml(error.message)}
        </div>
      `;

  }

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJs(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


/* =========================================================
   DELETE WORD
========================================================= */

async function deleteDictionaryWord(
  word,
  button
){

  if(
    !confirm(
      'Delete "' +
      word +
      '" from Dictionary?'
    )
  ){

    return;

  }

  button.disabled =
    true;

  try{

    const data =
      await apiGet({
        action:"deleteWord",
        word:word
      });

    if(!data.success){

      throw new Error(
        data.message ||
        "Delete failed."
      );

    }

    showMessage(
      "dictionaryMessage",
      "Word deleted successfully.",
      "success"
    );

    loadDictionary();

  }catch(error){

    button.disabled =
      false;

    showMessage(
      "dictionaryMessage",
      error.message,
      "error"
    );

  }

}


/* =========================================================
   EXCEL IMPORT
========================================================= */

async function importExcel(){

  const fileInput =
    document.getElementById(
      "excelFile"
    );

  const file =
    fileInput.files[0];

  if(!file){

    showMessage(
      "importMessage",
      "Please select an Excel or CSV file.",
      "error"
    );

    return;

  }

  showMessage(
    "importMessage",
    "Reading file...",
    "success"
  );

  try{

    const buffer =
      await file.arrayBuffer();

    const workbook =
      XLSX.read(
        buffer,
        {
          type:"array"
        }
      );

    const sheetName =
      workbook.SheetNames[0];

    const sheet =
      workbook.Sheets[
        sheetName
      ];

    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header:1,
          defval:""
        }
      );

    const words = [];

    rows.forEach(row=>{

      if(
        row &&
        row.length > 0
      ){

        const word =
          String(
            row[0] || ""
          ).trim();

        if(word){

          words.push(word);

        }

      }

    });

    if(words.length === 0){

      throw new Error(
        "No words found in first column."
      );

    }

    /* Remove duplicate words before sending */

    const uniqueWords =
      [];

    const seen =
      new Set();

    words.forEach(word=>{

      const key =
        word
          .toLowerCase()
          .replace(/\s+/g," ");

      if(!seen.has(key)){

        seen.add(key);

        uniqueWords.push(word);

      }

    });

    let totalAdded = 0;
    let totalUpdated = 0;
    let totalAlready = 0;
    let totalFailed = 0;

    const chunkSize =
      40;

    for(
      let i=0;
      i<uniqueWords.length;
      i+=chunkSize
    ){

      const chunk =
        uniqueWords.slice(
          i,
          i+chunkSize
        );

      showMessage(
        "importMessage",
        "Importing " +
        Math.min(
          i+chunk.length,
          uniqueWords.length
        ) +
        " / " +
        uniqueWords.length +
        "...",
        "success"
      );

      const data =
        await apiGet({
          action:"importWords",
          words:JSON.stringify(chunk)
        });

      if(data.success){

        totalAdded +=
          Number(data.added || 0);

        totalUpdated +=
          Number(data.updated || 0);

        totalAlready +=
          Number(data.alreadyAvailable || 0);

        totalFailed +=
          Number(data.failed || 0);

      }else{

        totalFailed +=
          chunk.length;

      }

    }

    document.getElementById(
      "importResult"
    ).innerHTML = `

      <div class="card">

        <b>Import Complete</b>

        <p>
          Added:
          <b>${totalAdded}</b>
        </p>

        <p>
          Updated:
          <b>${totalUpdated}</b>
        </p>

        <p>
          Already Available:
          <b>${totalAlready}</b>
        </p>

        <p>
          Failed:
          <b>${totalFailed}</b>
        </p>

        <p>
          Total Unique Words:
          <b>${uniqueWords.length}</b>
        </p>

      </div>

    `;

    showMessage(
      "importMessage",
      "Excel import completed successfully.",
      "success"
    );

    dictionaryLoaded =
      false;

  }catch(error){

    console.error(error);

    showMessage(
      "importMessage",
      error.message,
      "error"
    );

  }

}


/* =========================================================
   START EXAM
========================================================= */

async function startExam(){

  const count =
    Number(
      document.getElementById(
        "questionCount"
      ).value
    );

  const minutes =
    Number(
      document.getElementById(
        "examMinutes"
      ).value
    );

  if(
    !count ||
    count < 1
  ){

    showMessage(
      "examSetupMessage",
      "Please enter a valid question count.",
      "error"
    );

    return;

  }

  if(
    !minutes ||
    minutes < 1
  ){

    showMessage(
      "examSetupMessage",
      "Please enter a valid exam time.",
      "error"
    );

    return;

  }

  showMessage(
    "examSetupMessage",
    "Preparing exam...",
    "success"
  );

  try{

    const data =
      await apiGet({
        action:"examData",
        count:count
      });

    if(!data.success){

      throw new Error(
        data.message ||
        "Unable to prepare exam."
      );

    }

    examRecords =
      Array.isArray(data.records)
      ? data.records
      : [];

    if(examRecords.length === 0){

      throw new Error(
        "Dictionary is empty. Please add words first."
      );

    }

    examAnswers = {};

    examSubmitted =
      false;

    examTotalSeconds =
      minutes * 60;

    examRemainingSeconds =
      examTotalSeconds;

    document.getElementById(
      "examSetup"
    ).classList.add(
      "hidden"
    );

    document.getElementById(
      "examResult"
    ).classList.add(
      "hidden"
    );

    document.getElementById(
      "examArea"
    ).classList.remove(
      "hidden"
    );

    renderExam();

    startExamTimer();

  }catch(error){

    console.error(error);

    showMessage(
      "examSetupMessage",
      error.message,
      "error"
    );

  }

}


/* =========================================================
   RENDER EXAM
========================================================= */

function renderExam(){

  const container =
    document.getElementById(
      "examQuestions"
    );

  container.innerHTML =
    "";

  examRecords.forEach(
    (record,index)=>{

      const question =
        document.createElement(
          "div"
        );

      question.className =
        "exam-question";

      /*
        Correct answer is the Hindi meaning.
        We create distractors from other meanings.
      */

      const correct =
        String(
          record.meaning || ""
        ).trim();

      const distractors =
        examRecords
          .filter(
            (_,i)=>i !== index
          )
          .map(
            r => String(
              r.meaning || ""
            ).trim()
          )
          .filter(
            x => x &&
            x.toLowerCase() !==
            correct.toLowerCase()
          );

      const options =
        shuffleArray([
          correct,
          ...distractors.slice(
            0,
            3
          )
        ]);

      question.innerHTML = `

        <div class="question-number">
          Question ${index+1}
          of ${examRecords.length}
        </div>

        <div class="question-word">
          ${escapeHtml(record.word || "")}
        </div>

        <div class="options"></div>

        <div
          class="feedback"
          id="feedback-${index}">
        </div>

      `;

      const optionsContainer =
        question.querySelector(
          ".options"
        );

      options.forEach(
        option=>{

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "answer-option";

          button.textContent =
            option;

          button.onclick =
            function(){

              selectExamAnswer(
                index,
                option,
                correct,
                optionsContainer,
                button
              );

            };

          optionsContainer.appendChild(
            button
          );

        }
      );

      container.appendChild(
        question
      );

    }
  );

}


/* =========================================================
   ANSWER CLICK
========================================================= */

function selectExamAnswer(
  questionIndex,
  selectedAnswer,
  correctAnswer,
  optionsContainer,
  clickedButton
){

  /*
    Prevent changing answer
    after first click.
  */

  if(
    examAnswers[
      questionIndex
    ]
  ){

    return;

  }

  examAnswers[
    questionIndex
  ] = selectedAnswer;

  const buttons =
    optionsContainer
      .querySelectorAll(
        ".answer-option"
      );

  buttons.forEach(
    btn=>{

      btn.classList.add(
        "disabled"
      );

      btn.disabled =
        true;

      const value =
        btn.textContent.trim();

      if(
        value.toLowerCase() ===
        correctAnswer.toLowerCase()
      ){

        btn.classList.add(
          "correct"
        );

      }

    }
  );

  if(
    selectedAnswer.toLowerCase() ===
    correctAnswer.toLowerCase()
  ){

    /*
      Correct answer = GREEN
    */

    clickedButton.classList.add(
      "correct"
    );

    const feedback =
      document.getElementById(
        "feedback-" +
        questionIndex
      );

    feedback.innerHTML = `
      <div class="correct-answer">
        ✓ Correct Answer
      </div>
    `;

  }else{

    /*
      Wrong answer = RED
      Correct answer also shown
    */

    clickedButton.classList.add(
      "wrong"
    );

    const feedback =
      document.getElementById(
        "feedback-" +
        questionIndex
      );

    feedback.innerHTML = `
      <div
        style="
          margin-top:10px;
          padding:10px;
          background:#f8d7da;
          color:#842029;
          border-radius:7px;
          font-weight:bold;
        "
      >
        ✗ Wrong Answer
      </div>

      <div class="correct-answer">
        ✓ Correct Answer:
        ${escapeHtml(correctAnswer)}
      </div>
    `;

  }

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

  const arr =
    [...array];

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }

  return arr;

}


/* =========================================================
   EXAM TIMER
========================================================= */

function startExamTimer(){

  clearInterval(
    examTimer
  );

  updateExamTimer();

  examTimer =
    setInterval(
      ()=>{

        if(examRemainingSeconds <= 0){

          clearInterval(
            examTimer
          );

          autoSubmitExam();

          return;

        }

        examRemainingSeconds--;

        updateExamTimer();

      },
      1000
    );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateExamTimer(){

  document.getElementById(
    "totalTimeDisplay"
  ).textContent =
    formatTime(
      examTotalSeconds
    );

  const remaining =
    document.getElementById(
      "remainingTimeDisplay"
    );

  remaining.textContent =
    formatTime(
      examRemainingSeconds
    );

  if(
    examRemainingSeconds <= 60
  ){

    remaining.classList.add(
      "timer-danger"
    );

  }else{

    remaining.classList.remove(
      "timer-danger"
    );

  }

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds){

  const min =
    Math.floor(
      seconds / 60
    );

  const sec =
    seconds % 60;

  return String(min)
    .padStart(2,"0") +
    ":" +
    String(sec)
      .padStart(2,"0");

}


/* =========================================================
   SUBMIT EXAM
========================================================= */

async function submitExam(){

  if(examSubmitted){

    return;

  }

  examSubmitted =
    true;

  clearInterval(
    examTimer
  );

  const answers =
    examRecords.map(
      (record,index)=>({

        word:
          record.word,

        answer:
          examAnswers[index] ||
          "",

        correctAnswer:
          record.meaning || ""

      })
    );

  let correctCount =
    0;

  answers.forEach(
    item=>{

      if(
        item.answer &&
        item.answer.toLowerCase() ===
        item.correctAnswer.toLowerCase()
      ){

        correctCount++;

      }

    }
  );

  const score =
    correctCount;

  const total =
    examRecords.length;

  const percentage =
    total
    ? Math.round(
        (score / total) * 100
      )
    : 0;

  /*
    Save exam history server-side.
  */

  try{

    await apiGet({
      action:"saveExam",
      answers:JSON.stringify(
        answers
      )
    });

  }catch(error){

    console.error(
      "Exam save error:",
      error
    );

  }

  showExamResult(
    score,
    total,
    percentage
  );

}


/* =========================================================
   AUTO SUBMIT
========================================================= */

function autoSubmitExam(){

  if(examSubmitted){

    return;

  }

  submitExam();

}


/* =========================================================
   EXAM RESULT
========================================================= */

function showExamResult(
  score,
  total,
  percentage
){

  document.getElementById(
    "examArea"
  ).classList.add(
    "hidden"
  );

  const result =
    document.getElementById(
      "examResult"
    );

  result.classList.remove(
    "hidden"
  );

  result.innerHTML = `

    <div class="exam-result">

      <h2>Exam Completed</h2>

      <div class="score">
        ${score} / ${total}
      </div>

      <p>
        Percentage:
        <b>${percentage}%</b>
      </p>

      <button
        class="primary"
        onclick="resetExam()">
        Start New Exam
      </button>

    </div>

  `;

}


/* =========================================================
   RESET EXAM
========================================================= */

function resetExam(){

  clearInterval(
    examTimer
  );

  examRecords =
    [];

  examAnswers =
    {};

  examSubmitted =
    false;

  document.getElementById(
    "examArea"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "examResult"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "examSetup"
  ).classList.remove(
    "hidden"
  );

}

  "searchInput"
).addEventListener(

    if(
      event.key === "Enter"
    ){

      searchWord();

    }

  }
