  margin-top:18px;

}

  color:#5f6368;

  }

  }

  }

  }

</style>
</head>

<body>

<header>
  <h1>English → Hindi Dictionary</h1>
  <p>Gemini AI powered personal dictionary</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="openTab('searchPanel',this)">
      Search
    </button>

    <button class="tab" onclick="openTab('dictionaryPanel',this)">
      Dictionary
    </button>

    <button class="tab" onclick="openTab('importPanel',this)">
      Import
    </button>

    <button class="tab" onclick="openTab('examPanel',this)">
      Exam
    </button>
  </div>


  <!-- SEARCH -->
  <section id="searchPanel" class="panel active">

    <h2>Search Word</h2>

    <div class="searchRow">
      <input
        id="searchInput"
        type="text"
        placeholder="Enter English word..."
        autocomplete="off"
      >

      <button
        class="primary"
        onclick="searchWord()"
      >
        Search
      </button>
    </div>

    <div id="serverStatus" class="status">
      Checking server...
    </div>

    <div id="searchResult"></div>

  </section>


  <!-- DICTIONARY -->
  <section id="dictionaryPanel" class="panel">

    <h2>My Dictionary</h2>

    <div class="actions">
      <button
        class="primary"
        onclick="loadDictionary()"
      >
        Refresh
      </button>
    </div>

    <div id="dictionaryResult" class="loading">
      Loading...
    </div>

  </section>


  <!-- IMPORT -->
  <section id="importPanel" class="panel">

    <h2>Import Words</h2>

    <p class="small">
      Excel/CSV की पहली column में English words रखें।
    </p>

    <div class="fileRow">

      <input
        id="excelFile"
        type="file"
        accept=".xlsx,.xls,.csv"
      >

      <button
        class="primary"
        onclick="importExcel()"
      >
        Import
      </button>

    </div>

    <div id="importStatus"></div>

  </section>


  <!-- EXAM -->
  <section id="examPanel" class="panel">

    <h2>Vocabulary Exam</h2>

    <div class="searchRow">

      <input
        id="examCount"
        type="number"
        value="10"
        min="1"
        max="100"
      >

      <button
        class="primary"
        onclick="startExam()"
      >
        Start Exam
      </button>

    </div>

    <div id="examResult"></div>

  </section>

</div>


<script>

/* =====================================================
   API URL
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbznhwqwtBWBqUbUA-FVfOYNYAJkFUaCEcfwwTagpWfW7yk0tsCWYJfZB4gBErt7aQX/exec';


/*
 * Current displayed search record.
 * Save button इसी record को backend में भेजता है,
 * जिससे दोबारा Gemini call नहीं करनी पड़ती।
 */
let currentSearchRecord = null;

let currentExam = [];
let examChart = null;


/* =====================================================
   API GET
===================================================== */

async function apiGet(params) {

  const url =
    API_URL +
    '?' +
    new URLSearchParams(params).toString();

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      60000
    );

  try {

    const response =
      await fetch(
        url,
        {
          method:'GET',
          mode:'cors',
          cache:'no-store',
          signal:controller.signal
        }
      );

    const text =
      await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch(e) {
      throw new Error(
        'Server returned invalid JSON response.'
      );
    }

    return data;

  } catch(error) {

    if(error.name === 'AbortError'){
      throw new Error(
        'Request timed out. Gemini server took too long.'
      );
    }

    throw error;

  } finally {

    clearTimeout(timeout);
  }
}


/* =====================================================
   API POST
===================================================== */

async function apiPost(params) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      120000
    );

  try {

    const body =
      new URLSearchParams();

    Object.keys(params).forEach(function(key){
      body.append(
        key,
        params[key] == null
          ? ''
          : String(params[key])
      );
    });


    const response =
      await fetch(
        API_URL,
        {
          method:'POST',
          mode:'cors',
          cache:'no-store',

          /*
           * URL encoded avoids unnecessary
           * CORS preflight with Apps Script.
           */
          headers:{
            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'
          },

          body:body.toString(),
          signal:controller.signal
        }
      );


    const text =
      await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch(e) {
      throw new Error(
        'Server returned invalid JSON response.'
      );
    }

    return data;

  } catch(error) {

    if(error.name === 'AbortError'){
      throw new Error(
        'Request timed out.'
      );
    }

    throw error;

  } finally {

    clearTimeout(timeout);
  }
}


/* =====================================================
   CHECK SERVER
===================================================== */

async function checkServer(){

  const box =
    document.getElementById(
      'serverStatus'
    );

  try {

    const data =
      await apiGet({
        action:'health'
      });


    if(data.success){

      if(data.geminiConfigured){

        box.className =
          'status ok';

        box.innerHTML =
          '✓ Server connected — Gemini model: ' +
          escapeHtml(
            data.model || 'gemini-3.8-flash'
          );

      }else{

        box.className =
          'status error';

        box.innerHTML =
          'Server connected, but GEMINI_API_KEY is not configured in Script Properties.';

      }

    }else{

      box.className =
        'status error';

      box.textContent =
        data.message ||
        'Server error.';

    }

  } catch(error){

    box.className =
      'status error';

    box.textContent =
      'Connection error: ' +
      error.message;
  }
}


/* =====================================================
   TABS
===================================================== */

function openTab(id, button){

  document
    .querySelectorAll('.panel')
    .forEach(function(panel){
      panel.classList.remove('active');
    });


  document
    .querySelectorAll('.tab')
    .forEach(function(tab){
      tab.classList.remove('active');
    });


  document
    .getElementById(id)
    .classList.add('active');


  if(button){
    button.classList.add('active');
  }


  if(id === 'dictionaryPanel'){
    loadDictionary();
  }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value == null ? '' : value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


/* =====================================================
   SEARCH
===================================================== */

async function searchWord(){

  const input =
    document.getElementById(
      'searchInput'
    );

  const result =
    document.getElementById(
      'searchResult'
    );

  const word =
    input.value.trim();


  if(!word){

    result.innerHTML =
      '<div class="status error">' +
      'Please enter a word.' +
      '</div>';

    return;
  }


  currentSearchRecord = null;


  result.innerHTML =
    '<div class="loading">' +
    'Searching and generating dictionary data...' +
    '</div>';


  try {

    const data =
      await apiGet({
        action:'search',
        word:word
      });


    if(!data.success){

      throw new Error(
        data.message ||
        'Search failed.'
      );
    }


    currentSearchRecord =
      data.record || null;


    renderSearchResult(
      data.record,
      data.saved
    );


  } catch(error){

    result.innerHTML =
      '<div class="status error">' +
      '<b>Search failed:</b><br>' +
      escapeHtml(
        error.message
      ) +
      '</div>';
  }
}


/* =====================================================
   RENDER SEARCH
===================================================== */

function renderSearchResult(
  record,
  saved
){

  const result =
    document.getElementById(
      'searchResult'
    );


  if(!record){

    result.innerHTML =
      '<div class="status error">' +
      'No record returned.' +
      '</div>';

    return;
  }


  let sentences = [];


  if(
    Array.isArray(record.sentences)
  ){

    sentences =
      record.sentences
        .filter(function(s){
          return s &&
            s.english &&
            s.hindi;
        })
        .slice(0,2);

  }else{

    for(
      let i = 1;
      i <= 2;
      i++
    ){

      const en =
        record[
          'sentence' + i
        ] || '';

      const hi =
        record[
          'sentence' +
          i +
          'Hindi'
        ] || '';

      if(en && hi){

        sentences.push({
          english:en,
          hindi:hi
        });
      }
    }
  }


  let html = '';

  html +=
    '<div class="wordCard">';


  html +=
    '<div class="wordTitle">' +
    escapeHtml(
      record.word
    ) +
    '</div>';


  html +=
    '<div class="pronunciation">' +
    'उच्चारण: ' +
    escapeHtml(
      record.pronunciation ||
      ''
    ) +
    '</div>';


  html +=
    '<div class="meaningBox">' +
    '<b>Hindi Meaning:</b><br>' +
    escapeHtml(
      record.meaning ||
      ''
    ) +
    '</div>';


  if(sentences.length){

    sentences.forEach(function(sentence){

      html +=
        '<div class="sentence">' +

          '<div class="en">' +
          escapeHtml(
            sentence.english
          ) +
          '</div>' +

          '<div class="hi">' +
          escapeHtml(
            sentence.hindi
          ) +
          '</div>' +

        '</div>';
    });

  }else{

    html +=
      '<div class="status error">' +
      'No example sentences returned.' +
      '</div>';
  }


  html +=
    '<div class="actions">';


  if(saved){

    html +=
      '<button class="success" disabled>' +
      '✓ Saved' +
      '</button>';

  }else{

    html +=
      '<button ' +
      'class="success" ' +
      'onclick="saveSearchedWord()">' +
      'Save Word' +
      '</button>';
  }


  html +=
    '</div>';


  html +=
    '</div>';


  result.innerHTML =
    html;
}


/* =====================================================
   SAVE SEARCHED WORD
===================================================== */

async function saveSearchedWord(){

  if(!currentSearchRecord){

    alert(
      'No searched word available.'
    );

    return;
  }


  const word =
    currentSearchRecord.word;


  try {

    const data =
      await apiPost({
        action:'saveWord',
        word:word,
        record:JSON.stringify(
          currentSearchRecord
        )
      });


    if(!data.success){

      throw new Error(
        data.message ||
        'Could not save word.'
      );
    }


    currentSearchRecord =
      data.record ||
      currentSearchRecord;


    renderSearchResult(
      currentSearchRecord,
      true
    );


  } catch(error){

    alert(
      'Save failed: ' +
      error.message
    );
  }
}


/* =====================================================
   LOAD DICTIONARY
===================================================== */

async function loadDictionary(){

  const box =
    document.getElementById(
      'dictionaryResult'
    );


  box.innerHTML =
    '<div class="loading">' +
    'Loading dictionary...' +
    '</div>';


  try {

    const data =
      await apiGet({
        action:'allWords'
      });


    if(!data.success){

      throw new Error(
        data.message ||
        'Could not load dictionary.'
      );
    }


    const words =
      data.words || [];


    if(!words.length){

      box.innerHTML =
        '<div class="empty">' +
        'No saved words found.' +
        '</div>';

      return;
    }


    let html =
      '<div class="tableWrap">' +
      '<table>' +

      '<thead>' +
      '<tr>' +
      '<th>#</th>' +
      '<th>Word</th>' +
      '<th>Action</th>' +
      '</tr>' +
      '</thead>' +

      '<tbody>';


    words.forEach(function(item,index){

      html +=
        '<tr>' +

        '<td>' +
        (index + 1) +
        '</td>' +

        '<td>' +
        '<span class="wordLink" ' +
        'onclick=\'searchDictionaryWord(' +
        JSON.stringify(
          item.word
        ) +
        ')\'>' +
        escapeHtml(
          item.word
        ) +
        '</span>' +
        '</td>' +

        '<td>' +
        '<button ' +
        'class="danger" ' +
        'onclick=\'deleteDictionaryWord(' +
        JSON.stringify(
          item.word
        ) +
        ')\'>' +
        'Delete' +
        '</button>' +
        '</td>' +

        '</tr>';
    });


    html +=
      '</tbody>' +
      '</table>' +
      '</div>';


    box.innerHTML =
      html;


  } catch(error){

    box.innerHTML =
      '<div class="status error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';
  }
}


/* =====================================================
   SEARCH FROM DICTIONARY
===================================================== */

function searchDictionaryWord(word){

  document
    .getElementById(
      'searchInput'
    )
    .value = word;


  const searchButton =
    document.querySelector(
      '.tab'
    );


  openTab(
    'searchPanel',
    searchButton
  );


  searchWord();
}


/* =====================================================
   DELETE
===================================================== */

async function deleteDictionaryWord(word){

  if(
    !confirm(
      'Delete "' +
      word +
      '" from dictionary?'
    )
  ){

    return;
  }


  try {

    const data =
      await apiPost({
        action:'deleteWord',
        word:word
      });


    if(!data.success){

      throw new Error(
        data.message ||
        'Delete failed.'
      );
    }


    loadDictionary();


  } catch(error){

    alert(
      'Delete failed: ' +
      error.message
    );
  }
}


/* =====================================================
   IMPORT EXCEL / CSV
===================================================== */

async function importExcel(){

  const fileInput =
    document.getElementById(
      'excelFile'
    );

  const status =
    document.getElementById(
      'importStatus'
    );


  if(
    !fileInput.files ||
    !fileInput.files.length
  ){

    status.innerHTML =
      '<div class="status error">' +
      'Please select an Excel or CSV file.' +
      '</div>';

    return;
  }


  const file =
    fileInput.files[0];


  status.innerHTML =
    '<div class="status">' +
    'Reading file...' +
    '</div>';


  try {

    const buffer =
      await file.arrayBuffer();


    const workbook =
      XLSX.read(
        buffer,
        {
          type:'array'
        }
      );


    const firstSheet =
      workbook.Sheets[
        workbook.SheetNames[0]
      ];


    const rows =
      XLSX.utils.sheet_to_json(
        firstSheet,
        {
          header:1,
          defval:''
        }
      );


    const words = [];


    rows.forEach(function(row){

      if(
        row &&
        row.length
      ){

        const word =
          String(
            row[0] || ''
          ).trim();

        if(word){
          words.push(word);
        }
      }
    });


    if(!words.length){

      throw new Error(
        'No words found in first column.'
      );
    }


    /*
     * Frontend duplicate removal.
     */
    const unique = [];
    const seen = new Set();


    words.forEach(function(word){

      const key =
        word
          .toLowerCase()
          .replace(/\s+/g,' ')
          .trim();


      if(
        key &&
        !seen.has(key)
      ){

        seen.add(key);
        unique.push(word);
      }
    });


    /*
     * Small chunks keep request size safe.
     */
    const chunkSize = 15;

    let totalAdded = 0;
    let totalUpdated = 0;
    let totalSkipped = 0;
    let totalErrors = [];


    for(
      let start = 0;
      start < unique.length;
      start += chunkSize
    ){

      const chunk =
        unique.slice(
          start,
          start + chunkSize
        );


      status.innerHTML =
        '<div class="status">' +
        'Processing ' +
        Math.min(
          start + chunk.length,
          unique.length
        ) +
        ' / ' +
        unique.length +
        ' words...' +
        '</div>';


      const data =
        await apiPost({
          action:'importWords',
          words:JSON.stringify(
            chunk
          )
        });


      totalAdded +=
        Number(
          data.added || 0
        );

      totalUpdated +=
        Number(
          data.updated || 0
        );

      totalSkipped +=
        Number(
          data.skipped || 0
        );


      if(
        Array.isArray(
          data.errors
        )
      ){

        totalErrors =
          totalErrors.concat(
            data.errors
          );
      }
    }


    let message =
      'Import completed.<br>' +

      'Added: ' +
      totalAdded +

      '<br>Updated: ' +
      totalUpdated +

      '<br>Already available: ' +
      totalSkipped +

      '<br>Errors: ' +
      totalErrors.length;


    if(totalErrors.length){

      message +=
        '<br><br><b>Errors:</b><br>' +

        totalErrors
          .slice(0,20)
          .map(function(e){
            return escapeHtml(
              e.word +
              ': ' +
              e.message
            );
          })
          .join('<br>');
    }


    status.innerHTML =
      '<div class="status ' +
      (
        totalErrors.length
          ? 'error'
          : 'ok'
      ) +
      '">' +
      message +
      '</div>';


  } catch(error){

    status.innerHTML =
      '<div class="status error">' +
      '<b>Import failed:</b><br>' +
      escapeHtml(
        error.message
      ) +
      '</div>';
  }
}


/* =====================================================
   START EXAM
===================================================== */

async function startExam(){

  const count =
    document.getElementById(
      'examCount'
    ).value;


  const box =
    document.getElementById(
      'examResult'
    );


  box.innerHTML =
    '<div class="loading">' +
    'Preparing exam...' +
    '</div>';


  try {

    const data =
      await apiGet({
        action:'examData',
        count:count
      });


    if(!data.success){

      throw new Error(
        data.message ||
        'Could not start exam.'
      );
    }


    currentExam =
      data.questions || [];


    renderExam();


  } catch(error){

    box.innerHTML =
      '<div class="status error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';
  }
}


/* =====================================================
   RENDER EXAM
===================================================== */

function renderExam(){

  const box =
    document.getElementById(
      'examResult'
    );


  if(!currentExam.length){

    box.innerHTML =
      '<div class="empty">' +
      'No exam questions available.' +
      '</div>';

    return;
  }


  let html =
    '<form id="examForm">';


  currentExam.forEach(
    function(question,index){

      html +=
        '<div class="examQuestion">' +

        '<div class="examWord">' +
        (index + 1) +
        '. ' +
        escapeHtml(
          question.word
        ) +
        '</div>';


      const options =
        question.options || [];


      options.forEach(
        function(option,optIndex){

          const id =
            'q_' +
            index +
            '_' +
            optIndex;


          html +=
            '<label class="option" for="' +
            id +
            '">' +

            '<input ' +
            'type="radio" ' +
            'name="q_' +
            index +
            '" ' +
            'id="' +
            id +
            '" ' +
            'value="' +
            escapeHtml(
              option
            ) +
            '" ' +
            'required>' +

            ' ' +

            escapeHtml(
              option
            ) +

            '</label>';
        }
      );


      html +=
        '</div>';
    }
  );


  html +=
    '<div class="actions">' +

    '<button ' +
    'type="button" ' +
    'class="primary" ' +
    'onclick="submitExam()">' +
    'Submit Exam' +
    '</button>' +

    '</div>' +

    '</form>' +

    '<div id="examScore"></div>';


  box.innerHTML =
    html;
}


/* =====================================================
   SUBMIT EXAM
===================================================== */

async function submitExam(){

  const answers = [];
  let score = 0;


  currentExam.forEach(
    function(question,index){

      const selected =
        document.querySelector(
          'input[name="q_' +
          index +
          '"]:checked'
        );


      const answer =
        selected
          ? selected.value
          : '';


      const correct =
        String(
          question.meaning ||
          ''
        );


      if(answer === correct){
        score++;
      }


      answers.push({
        word:question.word,
        answer:answer,
        correct:correct
      });
    }
  );


  const scoreBox =
    document.getElementById(
      'examScore'
    );


  scoreBox.innerHTML =
    '<div class="loading">' +
    'Saving result...' +
    '</div>';


  try {

    await apiPost({
      action:'saveExam',
      answers:JSON.stringify(
        answers
      )
    });


  } catch(error){

    /*
     * Score can still be shown
     * even if history save fails.
     */
  }


  const percentage =
    Math.round(
      (
        score /
        currentExam.length
      ) *
      100
    );


  scoreBox.innerHTML =
    '<div class="resultBox">' +

    '<h3>Exam Result</h3>' +

    '<p>' +
    '<b>Score:</b> ' +
    score +
    ' / ' +
    currentExam.length +
    '</p>' +

    '<p>' +
    '<b>Percentage:</b> ' +
    percentage +
    '%</p>' +

    '</div>';
}
