<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>PATEL ASSOCIATES - English Hindi Dictionary</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

body {
  padding-bottom: 30px;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 12px;
}

.header {
  background: linear-gradient(135deg, #0b5ed7, #084298);
  color: white;
  padding: 18px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.12);
}

.header h1 {
  margin: 0;
  font-size: 23px;
  line-height: 1.2;
}

.header p {
  margin: 5px 0 0;
  font-size: 14px;
  opacity: 0.95;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.tab-button {
  border: none;
  background: white;
  color: #374151;
  padding: 13px 8px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  min-height: 48px;
}

.tab-button.active {
  background: #0b5ed7;
  color: white;
}

.panel {
  display: none;
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.panel.active {
  display: block;
}

.section-title {
  margin: 0 0 12px;
  font-size: 19px;
  color: #0b5ed7;
}

.search-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

input,
select,
button {
  font-family: inherit;
}

.text-input,
.number-input,
.select-input {
  width: 100%;
  min-height: 48px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 16px;
  outline: none;
  background: white;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #0b5ed7;
  box-shadow: 0 0 0 3px rgba(11,94,215,0.10);
}

.primary-button,
.secondary-button,
.danger-button {
  border: none;
  border-radius: 10px;
  min-height: 48px;
  padding: 10px 15px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.primary-button {
  background: #0b5ed7;
  color: white;
}

.secondary-button {
  background: #e9f1ff;
  color: #084298;
}

.danger-button {
  background: #dc3545;
  color: white;
}

.primary-button:disabled,
.secondary-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.result-card {
  margin-top: 14px;
  border: 1px solid #dbe4f0;
  border-radius: 12px;
  padding: 14px;
  background: #fbfdff;
}

.word-title {
  font-size: 25px;
  font-weight: bold;
  color: #0b5ed7;
  margin-bottom: 5px;
  word-break: break-word;
}

.meaning {
  font-size: 21px;
  font-weight: bold;
  color: #111827;
  margin: 8px 0;
}

.pronunciation {

  font-size: 14px;
  margin-bottom: 12px;
}

.sentence {
  border-left: 4px solid #0b5ed7;
  background: #f5f9ff;
  padding: 10px;
  margin-top: 10px;
  border-radius: 0 9px 9px 0;
}

.sentence-en {
  font-weight: bold;
  color: #111827;
}

.sentence-hi {
  margin-top: 5px;
  color: #374151;
}

.status {
  margin-top: 10px;
  padding: 10px;
  border-radius: 9px;
  font-size: 14px;
  display: none;
}

.status.show {
  display: block;
}

.status.success {
  background: #e8f7ee;
  color: #176b36;
}

.status.error {
  background: #fdecec;
  color: #a61b1b;
}

.status.info {
  background: #eaf2ff;
  color: #174ea6;
}

/************************************************
 * DICTIONARY LIST
 ************************************************/

.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.word-count {

}

.dictionary-list {

  flex-direction: column;
  gap: 7px;
}

.word-item {
  display: flex;
  align-items: center;

}

.word-open-button {

  text-align: left;
  background: #f7faff;
  border: 1px solid #dce7f5;
  border-radius: 10px;
  min-height: 46px;
  padding: 10px 12px;
  font-size: 16px;
  font-weight: bold;
  color: #164a8a;
  cursor: pointer;
  word-break: break-word;
}

.word-delete-button {
  width: 46px;
  min-width: 46px;
  min-height: 46px;
  border: none;
  border-radius: 10px;
  background: #ffe7e9;
  color: #b4232c;

}

.empty-box {

}

.loading-box {

  padding: 20px;
  color: #6b7280;
}

/************************************************
 * IMPORT
 ************************************************/

.file-box {

  border-radius: 12px;
  padding: 20px 12px;
  text-align: center;
  background: #f8fbff;
  margin-bottom: 12px;
}

.file-box input {
  width: 100%;
  font-size: 15px;
}

.import-result {
  margin-top: 12px;
}

/************************************************
 * EXAM SETUP
 ************************************************/

.exam-setting {
  margin-bottom: 12px;
}

.exam-setting label {
  display: block;

}

.exam-info {

  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.exam-info-box {
  background: #f4f7fb;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.exam-info-label {
  display: block;
  font-size: 12px;
  color: #6b7280;
}

.exam-info-value {
  display: block;
  margin-top: 3px;
  font-size: 19px;
  font-weight: bold;
  color: #0b5ed7;
}

.exam-question {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.35;
  margin: 15px 0;
}

.option-button {
  width: 100%;
  text-align: left;
  padding: 13px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  background: white;
  cursor: pointer;
  font-size: 16px;
  min-height: 48px;
}

.option-button:hover {
  background: #f3f7ff;
}

.option-button.selected {

}

.option-button.correct {

}

.option-button.wrong {
  border-color: #dc3545;

}

.exam-navigation {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.exam-navigation button {
  flex: 1;
}

.exam-progress {
  color: #6b7280;
  font-size: 14px;
}

.exam-finished {
  text-align: center;
  padding: 20px 10px;
}

.exam-score {
  font-size: 34px;
  font-weight: bold;
  color: #0b5ed7;
  margin: 10px 0;
}

/************************************************
 * RESPONSIVE
 ************************************************/

@media (min-width: 700px) {

  .container {
    padding: 20px;
  }

  .tabs {
    grid-template-columns: repeat(4, 1fr);
  }

  .panel {
    padding: 20px;
  }

  .header h1 {
    font-size: 28px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>PATEL ASSOCIATES</h1>
    <p>English → Hindi Personal Dictionary</p>
  </div>

  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab-button active"
      data-tab="searchPanel"
      onclick="openTab('searchPanel', this)"
    >
      🔎 Search Word
    </button>

    <button
      class="tab-button"
      data-tab="dictionaryPanel"
      onclick="openTab('dictionaryPanel', this)"
    >
      📚 Dictionary List
    </button>

    <button
      class="tab-button"
      data-tab="importPanel"
      onclick="openTab('importPanel', this)"
    >
      📥 Excel Import
    </button>

    <button
      class="tab-button"
      data-tab="examPanel"
      onclick="openTab('examPanel', this)"
    >
      📝 Exam
    </button>

  </div>


  <!-- SEARCH PANEL -->

  <div

      >

      <button
        id="searchButton"
        class="primary-button"
        onclick="searchEnglishWord()"
      >
        Search
      </button>

    </div>

    <div
      id="searchStatus"
      class="status"
    ></div>

    <div
      id="searchResult"
    ></div>

  </div>


  <!-- DICTIONARY LIST -->

  <div
    id="dictionaryPanel"
    class="panel"
  >

    <div class="list-header">

      <div>
        <h2 class="section-title" style="margin-bottom:3px;">
          Dictionary List
        </h2>

        <div
          id="wordCount"
          class="word-count"
        >
          0 words
        </div>
      </div>

      <button
        class="secondary-button"
        onclick="loadDictionary(true)"
      >
        🔄 Refresh
      </button>

    </div>

    <div
      id="dictionaryLoading"
      class="loading-box"
      style="display:none;"
    >
      Loading...

    <div

  <!-- IMPORT PANEL -->

      </p>

        accept=".xlsx,.xls,.csv"
      >

    <button
      id="importButton"
      class="primary-button"
      style="width:100%;"

      📥 Import Words
    </button>

    <div

      <div

      ></div>

        <button

          class="secondary-button"
          onclick="previousQuestion()"

          ← Previous
        </button>

        <button

          class="primary-button"
          onclick="nextQuestion()"
        >
          Next →
        </button>

        style="width:100%; margin-top:10px;"

      style="display:none;"

</div>


<script>

/************************************************
 * API URL
 ************************************************/

const API_URL =
  "https://https://script.google.com/macros/s/AKfycby1NEWq7JWr3BYOviTPgm15-uOkjpRSCcKHmW99ZbL0lpDApb_ZV3cY6C4dFFqnbqda/exec";


/************************************************
 * GLOBAL VARIABLES
 ************************************************/

let dictionaryLoaded = false;
let dictionaryWords = [];

let examRecords = [];
let examQuestions = [];
let examAnswers = [];
let currentQuestion = 0;

let examTotalSeconds = 0;
let examRemainingSeconds = 0;
let examTimer = null;

let examStarted = false;
let examFinished = false;


/************************************************
 * TAB SYSTEM
 ************************************************/

function openTab(panelId, button) {

  document
    .querySelectorAll(".panel")
    .forEach(function(panel) {
      panel.classList.remove("active");
    });

  document
    .querySelectorAll(".tab-button")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });

  const panel =
    document.getElementById(panelId);

  if (panel) {
    panel.classList.add("active");
  }

  if (button) {
    button.classList.add("active");
  }

  if (panelId === "dictionaryPanel") {
    loadDictionary(false);
  }
}


/************************************************
 * STATUS
 ************************************************/

function showStatus(
  elementId,
  message,
  type
) {

  const el =
    document.getElementById(elementId);

  if (!el) return;

  el.textContent = message;

  el.className =
    "status show " +
    (type || "info");
}

function hideStatus(elementId) {

  const el =
    document.getElementById(elementId);

  if (!el) return;

  el.className = "status";
}


/************************************************
 * GET API
 ************************************************/

async function apiGet(
  action,
  params = {},
  timeout = 15000
) {

  const query =
    new URLSearchParams();

  query.append("action", action);

  Object.keys(params).forEach(function(key) {
    query.append(
      key,
      params[key]
    );
  });

  query.append(
    "_",
    Date.now()
  );

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      function() {
        controller.abort();
      },
      timeout
    );

  try {

    const response =
      await fetch(
        API_URL +
        "?" +
        query.toString(),
        {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const text =
      await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error(
        "Invalid server response."
      );
    }

    return data;

  } finally {

    clearTimeout(timer);

  }
}


/************************************************
 * POST API
 ************************************************/

async function apiPost(
  data,
  timeout = 60000
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      function() {
        controller.abort();
      },
      timeout
    );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data),
          cache: "no-store",
          signal: controller.signal
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const text =
      await response.text();

    try {

      return JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Invalid server response."
      );
    }

  } finally {

    clearTimeout(timer);

  }
}


/************************************************
 * SEARCH
 ************************************************/

async function searchEnglishWord() {

  const input =
    document.getElementById(
      "searchInput"
    );

  const button =
    document.getElementById(
      "searchButton"
    );

  const result =
    document.getElementById(
      "searchResult"
    );

  const word =
    input.value.trim();

  if (!word) {

    showStatus(
      "searchStatus",
      "Please enter an English word.",
      "error"
    );

    input.focus();

    return;
  }

  button.disabled = true;

  button.textContent =
    "Searching...";

  result.innerHTML = "";

  showStatus(
    "searchStatus",
    "Searching and preparing Hindi meaning...",
    "info"
  );

  try {

    const data =
      await apiGet(
        "search",
        {
          word: word
        },
        30000
      );

    if (!data || data.success !== true) {

      throw new Error(
        data && data.message
          ? data.message
          : "Server error."
      );
    }

    renderSearchResult(
      data.record
    );

    showStatus(
      "searchStatus",
      "✅ Word saved in Dictionary.",
      "success"
    );

  } catch (error) {

    showStatus(
      "searchStatus",
      "❌ Server connection error: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "Search";
  }
}


/************************************************
 * SEARCH ENTER KEY
 ************************************************/

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {
        searchEnglishWord();
      }

    }
  );


/************************************************
 * RENDER SEARCH RESULT
 ************************************************/

function renderSearchResult(record) {

  if (!record) {
    return;
  }

  const sentences =
    Array.isArray(record.sentences)
      ? record.sentences
      : [];

  const first =
    sentences[0] || {
      english: "",
      hindi: ""
    };

  const second =
    sentences[1] || {
      english: "",
      hindi: ""
    };

  const pronunciation =
    record.pronunciation
      ? record.pronunciation
      : "";

  document
    .getElementById("searchResult")
    .innerHTML = `

      <div class="result-card">

        <div class="word-title">
          ${escapeHtml(record.word)}
        </div>

        <div class="meaning">
          ${escapeHtml(record.meaning)}
        </div>

        ${
          pronunciation
            ? `
              <div class="pronunciation">
                Pronunciation:
                ${escapeHtml(pronunciation)}
              </div>
            `
            : ""
        }

        <div class="sentence">

          <div class="sentence-en">
            1. ${escapeHtml(first.english)}
          </div>

          <div class="sentence-hi">
            → ${escapeHtml(first.hindi)}
          </div>

        </div>

        <div class="sentence">

          <div class="sentence-en">
            2. ${escapeHtml(second.english)}
          </div>

          <div class="sentence-hi">
            → ${escapeHtml(second.hindi)}
          </div>

        </div>

      </div>
    `;
}


/************************************************
 * DICTIONARY LOAD
 ************************************************/

async function loadDictionary(force) {

  if (
    dictionaryLoaded &&
    !force
  ) {
    return;
  }

  const loading =
    document.getElementById(
      "dictionaryLoading"
    );

  const list =
    document.getElementById(
      "dictionaryList"
    );

  loading.style.display =
    "block";

  list.innerHTML = "";

  try {

    const data =
      await apiGet(
        "allWords",
        {},
        10000
      );

    if (!data || data.success !== true) {

      throw new Error(
        data && data.message
          ? data.message
          : "Dictionary loading failed."
      );
    }

    dictionaryWords =
      Array.isArray(data.words)
        ? data.words
        : [];

    dictionaryLoaded = true;

    renderDictionaryList();

  } catch (error) {

    dictionaryLoaded = false;

    list.innerHTML = `
      <div class="empty-box">
        <b>Dictionary load होने में समस्या हुई।</b>
        <br><br>
        ${escapeHtml(error.message)}
        <br><br>
        <button
          class="primary-button"
          onclick="loadDictionary(true)"
        >
          Retry
        </button>
      </div>
    `;

  } finally {

    loading.style.display =
      "none";
  }
}


/************************************************
 * RENDER DICTIONARY
 ************************************************/

function renderDictionaryList() {

  const list =
    document.getElementById(
      "dictionaryList"
    );

  const count =
    document.getElementById(
      "wordCount"
    );

  count.textContent =
    dictionaryWords.length +
    (
      dictionaryWords.length === 1
        ? " word"
        : " words"
    );

  if (
    dictionaryWords.length === 0
  ) {

    list.innerHTML = `
      <div class="empty-box">
        Dictionary List Empty है।
        <br><br>
        Excel Import करें या नया English Word Search करें।
      </div>
    `;

    return;
  }

  const fragment =
    document.createDocumentFragment();

  dictionaryWords.forEach(function(item) {

    const row =
      document.createElement("div");

    row.className =
      "word-item";

    const openButton =
      document.createElement("button");

    openButton.className =
      "word-open-button";

    openButton.textContent =
      item.word;

    openButton.onclick =
      function() {
        showDictionaryWord(
          item.word
        );
      };

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "word-delete-button";

    deleteButton.textContent =
      "🗑";

    deleteButton.title =
      "Delete word";

    deleteButton.onclick =
      function() {
        deleteDictionaryWord(
          item.id,
          item.word
        );
      };

    row.appendChild(
      openButton
    );

    row.appendChild(
      deleteButton
    );

    fragment.appendChild(
      row
    );
  });

  list.appendChild(
    fragment
  );
}


/************************************************
 * SHOW DICTIONARY WORD DETAILS
 ************************************************/

async function showDictionaryWord(word) {

  const list =
    document.getElementById(
      "dictionaryList"
    );

  list.innerHTML = `
    <div class="loading-box">
      Loading meaning...
    </div>
  `;

  try {

    const data =
      await apiGet(
        "search",
        {
          word: word
        },
        30000
      );

    if (!data || data.success !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : "Unable to load word."
      );
    }

    list.innerHTML = `
      <button
        class="secondary-button"
        onclick="loadDictionary(true)"
        style="margin-bottom:10px;"
      >
        ← Back to Dictionary List
      </button>
    `;

    const detail =
      document.createElement("div");

    detail.innerHTML =
      createWordCardHtml(
        data.record
      );

    list.appendChild(
      detail
    );

  } catch (error) {

    list.innerHTML = `
      <div class="empty-box">

        <b>Word details load नहीं हुए।</b>

        <br><br>

        ${escapeHtml(error.message)}

        <br><br>

        <button
          class="primary-button"
          onclick="loadDictionary(true)"
        >
          Back
        </button>

      </div>
    `;
  }
}


/************************************************
 * WORD CARD HTML
 ************************************************/

function createWordCardHtml(record) {

  const sentences =
    Array.isArray(record.sentences)
      ? record.sentences
      : [];

  const first =
    sentences[0] || {};

  const second =
    sentences[1] || {};

  return `

    <div class="result-card">

      <div class="word-title">
        ${escapeHtml(record.word || "")}
      </div>

      <div class="meaning">
        ${escapeHtml(record.meaning || "")}
      </div>

      ${
        record.pronunciation
          ? `
            <div class="pronunciation">
              Pronunciation:
              ${escapeHtml(record.pronunciation)}
            </div>
          `
          : ""
      }

      <div class="sentence">

        <div class="sentence-en">
          1. ${escapeHtml(first.english || "")}
        </div>

        <div class="sentence-hi">
          → ${escapeHtml(first.hindi || "")}
        </div>

      </div>

      <div class="sentence">

        <div class="sentence-en">
          2. ${escapeHtml(second.english || "")}
        </div>

        <div class="sentence-hi">
          → ${escapeHtml(second.hindi || "")}
        </div>

      </div>

    </div>
  `;
}


/************************************************
 * DELETE DICTIONARY WORD
 ************************************************/

async function deleteDictionaryWord(
  id,
  word
) {

  const ok =
    confirm(
      "क्या आप '" +
      word +
      "' को Dictionary से delete करना चाहते हैं?"
    );

  if (!ok) {
    return;
  }

  try {

    const data =
      await apiGet(
        "deleteWord",
        {
          id: id
        },

      );

    if (!data || data.success !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : "Delete failed."
      );

  } catch (error) {

}


/************************************************
 * EXCEL IMPORT
 ************************************************/

async function importExcel() {

  const fileInput =
    document.getElementById(
      "excelFile"
    );

  const button =
    document.getElementById(
      "importButton"
    );

  const file =
    fileInput.files[0];

  if (!file) {

    showStatus(
      "importStatus",
      "कृपया Excel/CSV file select करें।",
      "error"
    );

    return;
  }

  button.disabled = true;

  button.textContent =
    "Reading Excel...";

  showStatus(
    "importStatus",
    "Excel file पढ़ी जा रही है...",
    "info"
  );

  document
    .getElementById("importResult")
    .innerHTML = "";

  try {

    const buffer =
      await file.arrayBuffer();

    const workbook =
      XLSX.read(
        buffer,
        {
          type: "array"
        }
      );

    const firstSheetName =
      workbook.SheetNames[0];

    const sheet =
      workbook.Sheets[
        firstSheetName
      ];

    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header: 1,
          defval: ""
        }
      );

    const words = [];

    const seen = {};

    rows.forEach(function(row) {

      if (
        !Array.isArray(row) ||
        row.length === 0
      ) {
        return;
      }

      const value =
        String(row[0] || "")
          .trim()
          .replace(/\s+/g, " ");

      if (!value) {
        return;
      }

      /*
       * Header automatically skip
       */
      const lower =
        value.toLowerCase();

      if (
        lower === "word" ||
        lower === "words" ||
        lower === "english word" ||
        lower === "english words"
      ) {
        return;
      }

      const normalized =
        value.toLowerCase();

      if (!seen[normalized]) {

        seen[normalized] = true;

        words.push(value);
      }
    });

    if (words.length === 0) {

      throw new Error(
        "Excel की first column में कोई word नहीं मिला।"
      );
    }

    button.textContent =
      "Uploading " +
      words.length +
      " words...";

    showStatus(
      "importStatus",
      words.length +
      " unique words server पर भेजे जा रहे हैं...",
      "info"
    );

    const data =
      await apiPost(
        {
          action: "importWords",
          words: words
        },
        120000
      );

    if (!data || data.success !== true) {

      throw new Error(
        data && data.message
          ? data.message
          : "Import failed."
      );
    }

    const added =
      Number(data.added || 0);

    const updated =
      Number(data.updated || 0);

    const already =
      Number(
        data.alreadyAvailable || 0
      );

    const failed =
      Number(data.failed || 0);

    const duplicateRemoved =
      Number(
        data.removedDuplicates || 0
      );

    document
      .getElementById("importResult")
      .innerHTML = `

        <div class="result-card">

          <b>✅ Import complete</b>

          <br><br>

          Added:
          <b>${added}</b>

          <br>

          Updated:
          <b>${updated}</b>

          <br>

          Already available:
          <b>${already}</b>

          <br>

          Failed:
          <b>${failed}</b>

          ${
            duplicateRemoved > 0
              ? `
                <br>
                Duplicate deleted:
                <b>${duplicateRemoved}</b>
              `
              : ""
          }

        </div>
      `;

    showStatus(
      "importStatus",
      "✅ Import successfully completed.",
      "success"
    );

    dictionaryLoaded = false;

  } catch (error) {

    showStatus(
      "importStatus",
      "❌ Import error: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "📥 Import Words";
  }
}


/************************************************
 * EXAM START
 ************************************************/

async function startExam() {

  const count =
    parseInt(
      document.getElementById(
        "questionCount"
      ).value,
      10
    );

  const minutes =
    parseInt(
      document.getElementById(
        "examMinutes"
      ).value,
      10
    );

  if (
    !count ||
    count < 1
  ) {

    showStatus(
      "examStatus",
      "Questions की संख्या सही डालें।",
      "error"
    );

    return;
  }

  if (
    !minutes ||
    minutes < 1
  ) {

    showStatus(
      "examStatus",
      "Total Time सही डालें।",
      "error"
    );

    return;
  }

  const button =
    document.getElementById(
      "startExamButton"
    );

  button.disabled = true;

  button.textContent =
    "Preparing Exam...";

  showStatus(
    "examStatus",
    "Dictionary से unique words और questions तैयार हो रहे हैं...",
    "info"
  );

  try {

    const data =
      await apiGet(
        "examData",
        {
          count: count
        },
        120000
      );

    if (!data || data.success !== true) {

      throw new Error(
        data && data.message
          ? data.message
          : "Exam server error."
      );
    }

    examRecords =
      Array.isArray(data.records)
        ? data.records
        : [];

    if (
      examRecords.length === 0
    ) {

      throw new Error(
        "Dictionary में exam के लिए words नहीं मिले।"
      );
    }

    examQuestions =
      createExamQuestions(
        examRecords
      );

    examAnswers =
      new Array(
        examQuestions.length
      ).fill(null);

    currentQuestion = 0;

    examTotalSeconds =
      minutes * 60;

    examRemainingSeconds =
      examTotalSeconds;

    examStarted = true;
    examFinished = false;

    document
      .getElementById(
        "examSetup"
      )
      .style.display = "none";

    document
      .getElementById(
        "examArea"
      )
      .style.display = "block";

    document
      .getElementById(
        "examFinished"
      )
      .style.display = "none";

    document
      .getElementById(
        "totalTimeDisplay"
      )
      .textContent =
      formatTime(
        examTotalSeconds
      );

    document
      .getElementById(
        "remainingTimeDisplay"
      )
      .textContent =
      formatTime(
        examRemainingSeconds
      );

    renderExamQuestion();

    startExamTimer();

  } catch (error) {

    showStatus(
      "examStatus",
      "❌ Exam server connection error: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "▶ Start Exam";
  }
}


/************************************************
 * CREATE MCQ
 ************************************************/

function createExamQuestions(records) {

  const questions = [];

  records.forEach(function(record) {

    const correct =
      String(
        record.meaning || ""
      ).trim();

    if (!correct) {
      return;
    }

    const wrongMeanings =
      records
        .filter(function(other) {

          return (
            other !== record &&
            String(
              other.meaning || ""
            ).trim() &&
            other.meaning.trim()
              .toLowerCase() !==
              correct.toLowerCase()
          );

        })
        .map(function(other) {
          return other.meaning.trim();
        });

    shuffleArray(
      wrongMeanings
    );

    const options =
      [correct]
        .concat(
          wrongMeanings.slice(
            0,
            3
          )
        );

    while (
      options.length < 4
    ) {

      options.push(
        "अन्य अर्थ"
      );
    }

    shuffleArray(
      options
    );

    questions.push({
      word: record.word,
      correct: correct,
      options: options
    });

  });

  return questions;
}


/************************************************
 * RENDER EXAM QUESTION
 ************************************************/

function renderExamQuestion() {

  if (
    !examQuestions.length
  ) {
    return;
  }

  const question =
    examQuestions[
      currentQuestion
    ];

  document
    .getElementById(
      "examProgress"
    )
    .textContent =
      "Question " +
      (currentQuestion + 1) +
      " of " +
      examQuestions.length;

  document
    .getElementById(
      "examQuestion"
    )
    .textContent =
      "What is the Hindi meaning of: " +
      question.word +
      "?";

  const optionsBox =
    document.getElementById(
      "examOptions"
    );

  optionsBox.innerHTML = "";

  question.options.forEach(
    function(option, index) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "option-button";

      button.textContent =
        String.fromCharCode(
          65 + index
        ) +
        ". " +
        option;

      button.onclick =
        function() {

          selectExamOption(
            index
          );

        };

      if (
        examAnswers[
          currentQuestion
        ] === index
      ) {

        button.classList.add(
          "selected"
        );
      }

      optionsBox.appendChild(
        button
      );

    }
  );

  document
    .getElementById(
      "previousButton"
    )
    .disabled =
    currentQuestion === 0;

  document
    .getElementById(
      "nextButton"
    )
    .textContent =
    currentQuestion ===
    examQuestions.length - 1
      ? "Last Question"
      : "Next →";
}


/************************************************
 * SELECT OPTION
 ************************************************/

function selectExamOption(index) {

  if (examFinished) {
    return;
  }

  examAnswers[
    currentQuestion
  ] = index;

  renderExamQuestion();
}


/************************************************
 * NEXT QUESTION
 ************************************************/

function nextQuestion() {

  if (
    currentQuestion <
    examQuestions.length - 1
  ) {

    currentQuestion++;

    renderExamQuestion();

  } else {

    finishExam(false);
  }
}


/************************************************
 * PREVIOUS
 ************************************************/

function previousQuestion() {

  if (
    currentQuestion > 0
  ) {

    currentQuestion--;

    renderExamQuestion();
  }
}


/************************************************
 * TIMER
 ************************************************/

function startExamTimer() {

  clearInterval(
    examTimer
  );

  examTimer =
    setInterval(
      function() {

        if (
          !examStarted ||
          examFinished
        ) {

          clearInterval(
            examTimer
          );

          return;
        }

        examRemainingSeconds--;

        document
          .getElementById(
            "remainingTimeDisplay"
          )
          .textContent =
          formatTime(
            Math.max(
              0,
              examRemainingSeconds
            )
          );

        if (
          examRemainingSeconds <= 0
        ) {

          clearInterval(
            examTimer
          );

          finishExam(true);
        }

      },
      1000
    );
}


/************************************************
 * FINISH EXAM
 ************************************************/

async function finishExam(timeUp) {

  if (examFinished) {
    return;
  }

  examFinished = true;
  examStarted = false;

  clearInterval(
    examTimer
  );

  let score = 0;

  examQuestions.forEach(
    function(question, index) {

      const selectedIndex =
        examAnswers[index];

      if (
        selectedIndex !== null &&
        question.options[selectedIndex] ===
          question.correct
      ) {

        score++;
      }

    }
  );

  const usedWords =
    examQuestions.map(
      function(question) {
        return question.word;
      }
    );

  const examId =
    "EX-" +
    Date.now().toString(36).toUpperCase();

  let saveMessage =
    "Saving exam...";

  const finishedBox =
    document.getElementById(
      "examFinished"
    );

  finishedBox.style.display =
    "block";

  finishedBox.innerHTML = `
    <div class="result-card">
      ${saveMessage}
    </div>
  `;

  try {

    const data =
      await apiPost(
        {
          action: "saveExam",
          examId: examId,
          words: usedWords,
          score: score,
          total: examQuestions.length,
          timeUp: timeUp
        },
        30000
      );

    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data && data.message
          ? data.message
          : "Exam save failed."
      );
    }

    finishedBox.innerHTML = `

      <div class="exam-score">
        ${score} / ${examQuestions.length}
      </div>

      <p>
        ${
          timeUp
            ? "⏰ Time Up"
            : "✅ Exam Completed"
        }
      </p>

      <p>
        Used Words Saved:
        <b>${data.savedWords || 0}</b>
      </p>

      <button
        class="primary-button"
        style="width:100%;"
        onclick="resetExamScreen()"
      >
        Start New Exam
      </button>

    `;

  } catch (error) {

    finishedBox.innerHTML = `

      <div class="exam-score">
        ${score} / ${examQuestions.length}
      </div>

      <p>
        ${
          timeUp
            ? "⏰ Time Up"
            : "✅ Exam Completed"
        }
      </p>

      <p style="color:#b4232c;">
        Exam result saved नहीं हो सका:
        ${escapeHtml(error.message)}
      </p>

      <button
        class="primary-button"
        style="width:100%;"
        onclick="resetExamScreen()"
      >
        Start New Exam
      </button>

    `;
  }
}


/************************************************
 * RESET EXAM SCREEN
 ************************************************/

function resetExamScreen() {

  clearInterval(
    examTimer
  );

  examStarted = false;
  examFinished = false;

  examRecords = [];
  examQuestions = [];
  examAnswers = [];
  currentQuestion = 0;

  document
    .getElementById(
      "examArea"
    )
    .style.display = "none";

  document
    .getElementById(
      "examFinished"
    )
    .style.display = "none";

  document
    .getElementById(
      "examSetup"
    )
    .style.display = "block";

  hideStatus(
    "examStatus"
  );
}


/************************************************
 * FORMAT TIME
 ************************************************/

function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const sec =
    seconds % 60;

  return (
    String(minutes).padStart(
      2,
      "0"
    ) +
    ":" +
    String(sec).padStart(
      2,
      "0"
    )
  );
}


/************************************************
 * SHUFFLE
 ************************************************/

function shuffleArray(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    const temp =
      array[i];

    array[i] =
      array[j];

    array[j] =
      temp;
  }

  return array;
}


/************************************************
 * HTML ESCAPE
 ************************************************/

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
